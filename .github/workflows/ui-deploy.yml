name: Restaurant UI Deployment

on:
    push:
        branches: [main]
        paths:
        - 'apps/restaurant-ui/**'
        - 'packages/**'
        - 'package.json'
        - 'pnpm-lock.yaml'
        - 'pnpm-workspace.yaml'
        - 'turbo.json'

permissions:
    contents: read
    packages: write

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Login in GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{github.actor}}
            password: ${{secrets.GITHUB_TOKEN}}

        - name: Build & Push UI Image
          uses: docker/build-push-action@v6
          with:
            context: .
            file: apps/restaurant-ui/Dockerfile
            push: true
            tags: |
                    ghcr.io/priyanshuchourasia/restaurant-ui:latest
                    ghcr.io/priyanshuchourasia/restaurant-ui:${{ github.sha }}

        - name: Deploy to VPS
          uses: appleboy/ssh-action@v1.2.2
          with:
            host: ${{ secrets.SSH_HOST }}
            username: ${{ secrets.SSH_USER }}
            port: ${{ secrets.SSH_PORT }}
            key: ${{ secrets.SSH_KEY }}
            script: |
                cd ${{ secrets.VPS_PATH }}
                docker compose pull
                docker compose up -d
                docker image prune -f
