name: restaurant-erp

services:
  db:
    image: postgres:16-alpine
    container_name: restaurant-erp-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: restaurant-erp-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    # .env.production provides defaults; environment below overrides DB_HOST
    # to the Docker service name so the API connects to the containerized DB.
    # NODE_ENV=development enables TypeORM schema sync + auto-seed on startup.
    env_file:
      - apps/api/.env.production
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: restaurant_erp
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
